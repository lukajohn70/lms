---
# cPanel Git™ Version Control Automated Deployment Configuration
# DLHS Academic Management System — lms.jlm.com.ng
deployment:
  tasks:
    - if [ -d "/home/gwylvxeo/lms.jlm.com.ng" ]; then export DEPLOYPATH=/home/gwylvxeo/lms.jlm.com.ng; elif [ -d "/home/gwylvxeo/public_html/lms" ]; then export DEPLOYPATH=/home/gwylvxeo/public_html/lms; else export DEPLOYPATH=/home/gwylvxeo/lms.jlm.com.ng; fi
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R dist/* $DEPLOYPATH/
    - /bin/cp -R api $DEPLOYPATH/
    - /bin/cp -R uploads $DEPLOYPATH/ 2>/dev/null || true
    - /bin/cp .htaccess $DEPLOYPATH/
    - /bin/cp check_db.php $DEPLOYPATH/ 2>/dev/null || true
    - /bin/cp deploy_database.php $DEPLOYPATH/ 2>/dev/null || true
    - /bin/chmod 755 $DEPLOYPATH/api
    - /bin/chmod -R 777 $DEPLOYPATH/api/logs 2>/dev/null || true
    - /bin/chmod -R 777 $DEPLOYPATH/api/uploads 2>/dev/null || true

